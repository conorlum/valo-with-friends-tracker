# The public ValoMaths demo (valomaths.onrender.com) also deploys from this repo, but
# it is configured by hand in the Render dashboard, outside this Blueprint: it is the
# old ValoMaths service switched over in place, so its Riot-registered URL never changed.
services:
  - type: web
    name: valowithfriendstracker
    runtime: python
    plan: standard  # a Blueprint sync resets the plan to whatever this says
    rootDir: webapp
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in the Render dashboard to the Render Postgres INTERNAL connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENABLE_RIOT_TXT
        value: "false"
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"
      # Stage 3: the friends-only replay upload. The code is set by hand in the dashboard (never
      # here); without it the upload routes 404. The worker's address comes from its service.
      - key: REPLAY_UPLOAD_CODE
        sync: false
      # The key that ends the how-to's address, /replays/upload/guide/<key>. Set by hand in the
      # dashboard (never here); without it that page 404s.
      - key: REPLAY_UPLOAD_GUIDE_KEY
        sync: false
      - key: REPLAY_WORKER_URL
        fromService:
          type: pserv
          name: replay-worker
          property: hostport
      # Map control for new replays on the worker (docs/map-control-worker-plan.md). Off until the
      # user turns it on: uncomment (or set it in the dashboard) once the new worker image is built.
      # - key: REPLAY_CONTROL_REMOTE
      #   value: "true"
      # The operator's secret for /admin/replays/* (deleting a match on request, reparsing the .vrf
      # archive; app/routers/replay_admin.py). Set by hand in the dashboard, never here; unset, those
      # routes 404.
      - key: REPLAY_ADMIN_TOKEN
        sync: false
  # Stage 3: parses uploaded .vrf files (replay_worker/). Private: reachable only from the web
  # service over Render's private network. No DB credentials and no secrets: it only parses.
  - type: pserv
    name: replay-worker
    runtime: docker
    dockerfilePath: replay_worker/Dockerfile
    dockerContext: .
    # Not yet measured in a container (no Docker here). On Windows the condense peaks near 1 GB
    # (969 MB on the smallest, 60 MB export); scaled to the 200 MB upload cap that is ~3.3 GB before
    # the parser's own (unmeasured) memory. 8 GB / 4 CPU keeps about 2x headroom over the whole
    # upload range (AFK run decision D10, 2026-09-27); one job runs at a time. Re-size from
    # Render's measured peak after real uploads (decision 9). 4c-8g is the Blueprint ID of the
    # dashboard's "Pro Plus" (4 CPU, 8 GB).
    plan: 4c-8g
    autoDeploy: true
    # The .vrf archive (docs/superpowers/specs/2026-10-01-control-heights-design.md, part 1). Only files
    # under the mount persist across deploys; a disk means no zero-downtime deploys and one instance, and
    # it can grow but never shrink. 50 GB keeps about 31 GB of archive (~350 matches) after the parse
    # reserve. The worker uses it only once REPLAY_ARCHIVE_DIR is set (below).
    disk:
      name: replay-archive
      mountPath: /var/replay
      sizeGB: 50
    envVars:
      - key: REPLAY_WORKER_PORT
        value: "8080"
      # Off in the Blueprint; turned on in the dashboard after the friends' message.
      # Off until the friends have been told their files are kept (the spec's rollout): uncomment (or
      # set it in the dashboard) to turn the archive on. Without it the worker parses and deletes, as before.
      # - key: REPLAY_ARCHIVE_DIR
      #   value: /var/replay
