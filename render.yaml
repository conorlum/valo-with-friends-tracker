# The public ValoMaths demo (valomaths.onrender.com) also deploys from this repo, but
# it is configured by hand in the Render dashboard, outside this Blueprint: it is the
# old ValoMaths service switched over in place, so its Riot-registered URL never changed.
services:
  - type: web
    name: valowithfriendstracker
    runtime: python
    # 1 CPU / 2 GB. One uvicorn process can't use a second core; the replay-worker below is the service that
    # needs two (it was 2c-4g here from 2026-10-07 to 2026-10-08 by mistake). A Blueprint sync resets the plan
    # to whatever this says.
    plan: standard
    rootDir: webapp
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in the Render dashboard to the Render Postgres INTERNAL connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENABLE_RIOT_TXT
        value: "false"
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"
      # Stage 3: the friends-only replay upload. The code is set by hand in the dashboard (never
      # here); without it the upload routes 404. The worker's address comes from its service.
      - key: REPLAY_UPLOAD_CODE
        sync: false
      # The key that ends the how-to's address, /replays/upload/guide/<key>. Set by hand in the
      # dashboard (never here); without it that page 404s.
      - key: REPLAY_UPLOAD_GUIDE_KEY
        sync: false
      - key: REPLAY_WORKER_URL
        fromService:
          type: pserv
          name: replay-worker
          property: hostport
      # Map control for new replays on the worker (docs/map-control-worker-plan.md).
      - key: REPLAY_CONTROL_REMOTE
        value: "true"
      # Automatically re-parse stale uploaded replays, one accepted attempt at a time
      # (RENDER_DEPLOY.md, "The automatic re-parse queue"; on since 2026-10-08). Requires site control,
      # matching worker recipe, archive/control enabled and both worker protocols.
      - key: REPLAY_REPARSE_AUTO
        value: "true"
      # The operator's secret for /admin/replays/* (deleting a match on request, reparsing the .vrf
      # archive; app/routers/replay_admin.py). Set by hand in the dashboard, never here; unset, those
      # routes 404.
      - key: REPLAY_ADMIN_TOKEN
        sync: false
      # Height rebuilds on the worker (RENDER_DEPLOY.md, "Height rebuilds on the worker"): on from the merge. It
      # needs REPLAY_CONTROL_REMOTE on. Until the worker's own deploy lands the site waits for it at no cost.
      # Never set it on valomaths (demo mode turns it off anyway).
      - key: REPLAY_HEIGHTS_AUTO
        value: "true"
      # Map pool: a daily check of playvalorant.com patch notes for Competitive pool changes
      # (app/services/map_pool_refresh.py), on from the merge. Without it the committed seed alone is the pool.
      # Never set it on valomaths (demo mode turns it off anyway).
      - key: MAP_POOL_AUTO
        value: "true"
      # Map control limits (spec 2026-10-14, D5): rounds in flight, and from how many replays.
      - key: CONTROL_MAX_RUNS
        value: "40"
      - key: CONTROL_MAX_MATCHES
        value: "1"
      # Height rebuilds open at once, one per map (spec 2026-10-14, D16). The site opens more than one only
      # while the worker's heights runner is workflow; a local runner gets one at a time, as before.
      - key: HEIGHTS_MAX_BUILDS
        value: "4"
  # Stage 3: parses uploaded .vrf files (replay_worker/). Private: reachable only from the web
  # service over Render's private network. No DB credentials and no secrets: it only parses.
  - type: pserv
    name: replay-worker
    runtime: docker
    dockerfilePath: replay_worker/Dockerfile
    dockerContext: .
    # 2 CPU / 4 GB ("Pro", Blueprint ID 2c-4g; the user's choice on 2026-10-05). Map control uses both cores,
    # but only while nothing is parsing; a parse kills its children (docs/superpowers/plans/2026-10-05-control-idle-queue.md).
    # Memory: the condense peaked near 1 GB on a 60 MB export, ~3.3 GB scaled to the 200 MB upload cap, before the
    # parser's own (unmeasured) memory. 4 GB is tight for the largest uploads; re-size from Render's measured peak.
    plan: 2c-4g
    autoDeploy: true
    # The .vrf archive (docs/superpowers/specs/2026-10-01-control-heights-design.md, part 1). Only files
    # under the mount persist across deploys; a disk means no zero-downtime deploys and one instance, and
    # it can grow but never shrink. 50 GB keeps about 31 GB of archive (~350 matches) after the parse
    # reserve. The worker uses it through REPLAY_ARCHIVE_DIR (below).
    disk:
      name: replay-archive
      mountPath: /var/replay
      sizeGB: 50
    envVars:
      - key: REPLAY_WORKER_PORT
        value: "8080"
      # The archive is on: uploaded .vrf files are kept, and the re-parse queue reads them. Without
      # it the worker parses and deletes, and the site's re-parse queue stops.
      - key: REPLAY_ARCHIVE_DIR
        value: /var/replay
      # Render Workflows (docs/superpowers/specs/2026-10-14-render-workflows-design.md). The workflow service
      # (replay-tasks) is created by hand in the dashboard: Render can't create a Docker workflow from a
      # Blueprint.
      - key: RENDER_API_KEY
        sync: false
      - key: REPLAY_WORKFLOW_SLUG
        value: replay-tasks
      - key: REPLAY_TASK_STARTS_PER_MIN
        value: "1000"
      # The three switches are the owner's, set in the dashboard (spec D2): `sync: false`, so a Blueprint sync
      # never resets one that was flipped to workflow. Unset, each is "local" (server.py's default).
      - key: REPLAY_PARSE_RUNNER
        sync: false
      - key: REPLAY_CONTROL_RUNNER
        sync: false
      - key: REPLAY_HEIGHTS_RUNNER
        sync: false
      - key: REPLAY_CONTROL_RUNS
        value: "40"
      - key: REPLAY_CONTROL_QUEUE
        value: "64"
      - key: REPLAY_PARSE_PARALLEL
        value: "15"
      # Admits 15 waiting/running jobs (spec D15). The archive's parse reserve grows by 10 x the 200 MB cap
      # (replay_worker/archive.py parse_reserve), about 2 GB less archive. Only while REPLAY_PARSE_RUNNER is
      # workflow: a local parser keeps the image's 5 (server.py keep_local_sizing), and the site its batch of 5.
      - key: REPLAY_QUEUE_SIZE
        value: "15"
      # The control caches on the disk, so workflow runs share them and they survive deploys (spec D6). Used only
      # while REPLAY_CONTROL_RUNNER is workflow; a local runner keeps /jobs/control_cache and the archive's whole
      # budget (server.py keep_local_sizing).
      - key: CONTROL_CACHE_DIR
        value: /var/replay/control_cache
      - key: REPLAY_HEIGHT_BUILDS_MAX
        value: "4"
      - key: REPLAY_HEIGHT_SPOOL_BYTES
        value: "2147483648"
      # The spool on the disk, inside the archive's reserve (spec D16); packed tars go beside it in height_runs/.
      # Both spool settings apply only while REPLAY_HEIGHTS_RUNNER is workflow: a local runner keeps today's 512 MB
      # spool in /jobs and the archive's whole budget (server.py keep_local_sizing).
      - key: REPLAY_HEIGHT_SPOOL_DIR
        value: /var/replay/height_builds
