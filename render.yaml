services:
  - type: web
    name: valowithfriendstracker
    runtime: python
    plan: free
    rootDir: webapp
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in the Render dashboard to the Render Postgres INTERNAL connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENABLE_RIOT_TXT
        value: "false"
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"

  # The public ValoMaths demo: same code, its own Render Postgres (valomaths-demo-db,
  # created outside this blueprint like the friends DB) holding only sample data.
  # Deployed under this temporary name first; see webapp/RENDER_DEPLOY.md for the
  # cutover that retires the old ValoMaths service.
  - type: web
    name: valomaths-demo
    runtime: python
    plan: free
    rootDir: webapp
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in the Render dashboard to the DEMO DB's INTERNAL connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: SITE_NAME
        value: "ValoMaths"
      - key: DEMO_MODE
        value: "true"
      - key: ENABLE_RIOT_TXT
        value: "true"
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"
