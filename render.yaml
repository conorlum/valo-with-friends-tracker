# The public ValoMaths demo (valomaths.onrender.com) also deploys from this repo, but
# it is configured by hand in the Render dashboard, outside this Blueprint: it is the
# old ValoMaths service switched over in place, so its Riot-registered URL never changed.
services:
  - type: web
    name: valowithfriendstracker
    runtime: python
    plan: standard  # a Blueprint sync resets the plan to whatever this says
    rootDir: webapp
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in the Render dashboard to the Render Postgres INTERNAL connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENABLE_RIOT_TXT
        value: "false"
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"
      # Stage 3: the friends-only replay upload. The code is set by hand in the dashboard (never
      # here); without it the upload routes 404. The worker's address comes from its service.
      - key: REPLAY_UPLOAD_CODE
        sync: false
      - key: REPLAY_WORKER_URL
        fromService:
          type: pserv
          name: replay-worker
          property: hostport
  # Stage 3: parses uploaded .vrf files (replay_worker/). Private: reachable only from the web
  # service over Render's private network. No DB credentials and no secrets: it only parses.
  - type: pserv
    name: replay-worker
    runtime: docker
    dockerfilePath: replay_worker/Dockerfile
    dockerContext: .
    # PROVISIONAL(D10): decision 9 wants RAM >= 2x the container's peak parse + condense. Not yet
    # measured in a container (no Docker here); on Windows the condense peaks near 1 GB (969 MB on
    # the smallest competitive export), so 4 GB until Render's own measurement.
    plan: pro
    autoDeploy: true
    envVars:
      - key: REPLAY_WORKER_PORT
        value: "8080"
