name: Deploy pipeline

on:
  workflow_dispatch:
    inputs:
      skip_drain:
        description: Deploy immediately while pausing new work
        type: boolean
        default: false
      dry_run:
        description: Drain and report commits without deploying
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'webapp/tests/**'
      - 'uploader/**'

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # A merged PR labelled skip-drain deploys like a manual run with skip_drain. If the
      # lookup fails, the merge gets the normal drained deploy.
      - name: Read the merged PR's skip-drain label
        id: pr
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[].labels[].name' || true)
          if printf '%s\n' "$labels" | grep -qx 'skip-drain'; then
            echo "skip_drain=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The merged PR is labelled skip-drain: deploying without the drain"
          fi
      - name: Drain and deploy
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEMO_URL: ${{ secrets.DEMO_URL }}
          REPLAY_ADMIN_TOKEN: ${{ secrets.REPLAY_ADMIN_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKFLOW_ID: ${{ secrets.RENDER_WORKFLOW_ID }}
          RENDER_DEPLOY_HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
          RENDER_DEPLOY_HOOK_SITE: ${{ secrets.RENDER_DEPLOY_HOOK_SITE }}
          RENDER_DEPLOY_HOOK_DEMO: ${{ secrets.RENDER_DEPLOY_HOOK_DEMO }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ inputs.skip_drain }}" = "true" ]; then
            args+=(--skip-drain)
          fi
          if [ "${{ steps.pr.outputs.skip_drain }}" = "true" ]; then
            args+=(--skip-drain)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python webapp/scripts/deploy_pipeline.py --run-id ${{ github.run_id }} --sha ${{ github.sha }} "${args[@]}"
