name: Project tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: webapp

env:
  DATABASE_URL: sqlite://
  DEMO_MODE: 'false'
  MAP_POOL_AUTO: 'false'
  REPLAY_CONTROL_REMOTE: 'false'

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -n 2 -m 'not slow and not postgres and not browser and not corpus' --require-node --require-fixtures -ra --junitxml=offline-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results
          path: webapp/offline-results.xml

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: valo_coverage_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d valo_coverage_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VALO_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@127.0.0.1:5432/valo_coverage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -n 0 -m 'postgres and not corpus and not slow' --require-postgres -ra --junitxml=postgres-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-results
          path: webapp/postgres-results.xml

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python -m pytest tests/browser -n 0 -m browser --require-browser --require-fixtures -ra --junitxml=browser-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: webapp/browser-results.xml

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -n 2 -m 'slow and not postgres and not browser and not corpus' --require-node --require-fixtures -ra --junitxml=slow-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-results
          path: webapp/slow-results.xml
