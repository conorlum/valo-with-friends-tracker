{% extends "base.html" %}

{% block title %}Players - ValoMaths{% endblock %}

{% block content %}
<h1>Players</h1>
<div class="card">
<table>
  <thead>
    <tr>
      <th>Player</th>
      <th>Matches</th>
    </tr>
  </thead>
  <tbody>
    {% for p in players %}
    <tr class="clickable-row" onclick="window.location='/players/{{ p.display_name | urlencode }}'">
      <td><a href="/players/{{ p.display_name | urlencode }}">{{ p.display_name }}</a></td>
      <td>{{ p.matches_played }}</td>
    </tr>
    {% else %}
    <tr><td colspan="2">No players yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
