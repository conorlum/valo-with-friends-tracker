# The test suites: what each one checks, which code it guards, and which test files it holds.
#
#   python scripts/test_catalog.py list                     every suite, with its size and serial time
#   python scripts/test_catalog.py plan --git               the suites a branch's changes need, the time, the commands
#   python scripts/test_catalog.py plan app/control/engine.py
#   python scripts/test_catalog.py run --git [--slow]       run them, then a per-suite report against the estimate
#   python scripts/test_catalog.py check                    every test file in exactly one suite (tests/test_test_catalog.py)
#
# Paths are relative to webapp/ ("../" reaches the repo root) and are globs: `*` stays inside one folder, `**`
# crosses folders. `tests` names each test file exactly once across all suites. `guards` names the code a suite
# protects; a file may be guarded by several suites, and every file under app/ and ../replay_worker/ must be
# guarded by at least one. A suite's own test files and their helpers count as guarded by it without listing.
# Times are never written here: they come from tests/timings.json (scripts/test_timings.py).

