[pytest]
# Run from webapp/ (`python -m pytest`). The everyday run leaves out the slow tests and spreads the rest over a
# third of the machine's cores, never its last four (tests/conftest.py). `-m slow` runs only the slow ones,
# `-m ""` runs everything, `-n 0` runs in this one process. See "Running the tests" in CLAUDE.md.
testpaths = tests
pythonpath = .
addopts = -m "not slow and not browser and not corpus" -n auto --dist worksteal
markers =
    slow: 5 s or more on its own (toy-map geometry, real map assets, cross-process measurements); run with -m slow
    geometry: builds map-control geometry (control, heights, features, gaps); set by tests/replays/conftest.py
    postgres: calls the guarded PostgreSQL boundary directly or through its fixtures; run serially
    corpus: optional measurement against an approved existing corpus
    browser: local Playwright acceptance journeys; run with -m browser
