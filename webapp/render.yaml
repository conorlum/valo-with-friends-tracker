services:
  - type: web
    name: donttellriottracker
    runtime: python
    plan: free
    rootDir: webapp
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: donttellriottracker-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENABLE_RIOT_TXT
        value: "false"
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"

databases:
  - name: donttellriottracker-db
    plan: free
    postgresMajorVersion: "16"
